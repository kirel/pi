---
wyoming_openai_image: ghcr.io/roryeckel/wyoming_openai:latest
wyoming_openai_pull_policy: always

wyoming_openai_container_name: wyoming-openai

# Wyoming OpenAI Gateway (Wyoming protocol) - CrispASR STT + Qwen3-TTS via llama-swap
wyoming_openai_external_port: 10300
wyoming_openai_internal_port: 10300

wyoming_uri: "tcp://0.0.0.0:{{ wyoming_openai_internal_port }}"
wyoming_log_level: INFO
wyoming_languages: en es fr de it pt ru ja ko ar da el fi he hi ms nl no pl sv sw tr

# wyoming_openai config

stt_backend: "OPENAI"
stt_openai_url: "http://{{ ailab_ubuntu_ip }}:{{ llamaswap_port }}/v1"
stt_model: "whisper-large-v3-turbo-q8-crispasr"
tts_backend: "OPENAI"
tts_openai_url: "http://{{ ailab_ubuntu_ip }}:{{ llamaswap_port }}/v1"
tts_models: "qwen3-tts"

# TTS Configuration
tts_voices: "de-host"
tts_speed: "1.0"
# CrispASR WAV responses include LIST/C2PA chunks after the PCM data. Wyoming
# OpenAI 0.5.0 strips only the leading WAV header and would play those trailing
# metadata bytes as a short burst of noise. Request headerless PCM instead.
tts_extra_body: '{"response_format":"pcm"}'

# Streaming Configuration for your models.
# wyoming_openai streams TTS incrementally by sentence-chunking and pipelining
# OpenAI-compatible /audio/speech requests; the Qwen backend itself can still
# return normal WAV responses per chunk.
stt_streaming_models: "{{ stt_model }}"
tts_streaming_models: "qwen3-tts"
tts_streaming_min_words: 3
tts_streaming_max_chars: 280
