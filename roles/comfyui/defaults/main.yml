  - kornia==0.8.2
comfyui_openclaw_ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGOtmOfi47EnpdA/9ciKYhLI2b9+aGCWby3aRWgRb5D7 shrimp-openclaw@github.com"
comfyui_openclaw_ssh_enabled: true
