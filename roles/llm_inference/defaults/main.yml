---
# defaults file for llm_inference

# --- llama-swap Settings ---
llamaswap_enabled: true
llamaswap_container_name: "llama-swap"
llamaswap_image: "ghcr.io/mostlygeek/llama-swap:cuda@sha256:74eb596938b6c907789924a84a7ce2b6bd43a22bb2f99675b90ca5fd88801c22"
llamaswap_port: "8080"
llamaswap_config_path: "{{ llamaswap_host_path }}"
llamaswap_backend_network: "llamaswap-backends"
llamaswap_crispasr_image: "ghcr.io/crispstrobe/crispasr@sha256:242d3ee300b4c5593239dfa6a00de4166f704c4634e3058246547b48b11c9699"
llamaswap_crispasr_container_name: "llamaswap-crispasr-asr"
llamaswap_crispasr_internal_port: 8080
llamaswap_crispasr_wyoming_port: 10302
llamaswap_crispasr_cache_path: "{{ llamaswap_config_path }}/crispasr-cache"
llamaswap_crispasr_cache_container_path: "/cache"
llamaswap_crispasr_model_repo: "ggerganov/whisper.cpp"
llamaswap_crispasr_model_file: "ggml-large-v3-turbo-q8_0.bin"
# A single Whisper large-v3-turbo Q8 worker reached ~96x realtime with a
# 1.3 GiB process peak on the RTX 5060 Ti. Start with one serialized worker;
# additional workers multiply model memory and are unnecessary for voice notes.
llamaswap_crispasr_workers: 1
# Keep ASR on the same RTX 3090 (GPU0) previously used by Parakeet.
llamaswap_crispasr_gpu_uuid: "{{ gpu_3090_0_uuid }}"
# CrispASR Qwen3-TTS runs as a sibling container managed by llama-swap.
llamaswap_crispasr_tts_container_name: "llamaswap-crispasr-tts"
llamaswap_crispasr_tts_design_container_name: "llamaswap-crispasr-tts-design"
llamaswap_crispasr_tts_internal_port: 8080
llamaswap_crispasr_tts_cache_path: "{{ llamaswap_config_path }}/crispasr-tts-cache"
llamaswap_crispasr_tts_cache_container_path: "/cache"
llamaswap_crispasr_tts_voices_path: "{{ llamaswap_config_path }}/crispasr-tts-voices"
llamaswap_crispasr_tts_voices_container_path: "/voices"
llamaswap_crispasr_tts_backend: "qwen3-tts-1.7b-base"
llamaswap_crispasr_tts_design_backend: "qwen3-tts-1.7b-voicedesign"
llamaswap_crispasr_tts_gpu_uuid: "{{ gpu_3090_1_uuid }}"
llamaswap_crispasr_tts_voice: "de-host"
# Existing faster-qwen3-tts references remain the migration source. The newest
# completed entry (identified by its speaker embedding) is copied to CrispASR.
llamaswap_qwen3_tts_voices_path: "{{ llamaswap_config_path }}/qwen3-tts"
# seconds llama-swap waits for a subprocess to become healthy before killing it.
# Generous default to allow first-time HF downloads (vLLM AWQ weights ~20GB).
llamaswap_health_check_timeout: 1800
llamaswap_preload: []
llamaswap_qwen3_tts_voice_cache_path: "{{ llamaswap_qwen3_tts_voices_path }}/voice-cache"
