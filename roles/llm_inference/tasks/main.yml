---
# tasks file for llm_inference

- name: Stop llama-swap container when disabled
  community.docker.docker_container:
    name: "{{ llamaswap_container_name }}"
    state: absent
  become: true
  when: not (llamaswap_enabled | bool)

- name: Ensure llama-swap config directory exists
  ansible.builtin.file:
    path: "{{ llamaswap_config_path }}"
    state: directory
    mode: "0755"
  become: true
  when: llamaswap_enabled | bool

- name: Ensure llama-swap cache directory is owned by container user
  ansible.builtin.file:
    path: "{{ llamaswap_config_path }}/cache"
    state: directory
    owner: "10001"
    group: "10001"
    recurse: true
  become: true
  when: llamaswap_enabled | bool

- name: Ensure CrispASR model cache directory exists
  ansible.builtin.file:
    path: "{{ llamaswap_crispasr_cache_path }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  become: true
  when: llamaswap_enabled | bool

- name: Ensure CrispASR TTS directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ llamaswap_crispasr_tts_cache_path }}"
    - "{{ llamaswap_crispasr_tts_voices_path }}"
  become: true
  when: llamaswap_enabled | bool

- name: Find completed legacy reference for the CrispASR voice
  ansible.builtin.find:
    paths: "{{ llamaswap_qwen3_tts_voice_cache_path }}"
    patterns: "{{ llamaswap_crispasr_tts_voice }}.*.speaker.pt"
    file_type: file
  register: llamaswap_crispasr_tts_voice_refs
  become: true
  when: llamaswap_enabled | bool

- name: Require a completed legacy reference for the CrispASR voice
  ansible.builtin.assert:
    that:
      - llamaswap_crispasr_tts_voice_refs.matched | int > 0
    fail_msg: "No completed {{ llamaswap_crispasr_tts_voice }} reference exists in {{ llamaswap_qwen3_tts_voice_cache_path }}"
  when: llamaswap_enabled | bool

- name: Select newest completed legacy voice reference
  ansible.builtin.set_fact:
    llamaswap_crispasr_tts_voice_stem: >-
      {{ (llamaswap_crispasr_tts_voice_refs.files | sort(attribute='mtime') | last).path
         | regex_replace('\.speaker\.pt$', '') }}
  when: llamaswap_enabled | bool

- name: Read migrated voice metadata
  ansible.builtin.slurp:
    src: "{{ llamaswap_crispasr_tts_voice_stem }}.json"
  register: llamaswap_crispasr_tts_voice_metadata
  become: true
  when: llamaswap_enabled | bool

- name: Install migrated CrispASR voice reference
  ansible.builtin.copy:
    src: "{{ llamaswap_crispasr_tts_voice_stem }}.wav"
    dest: "{{ llamaswap_crispasr_tts_voices_path }}/{{ llamaswap_crispasr_tts_voice }}.wav"
    remote_src: true
    owner: "1000"
    group: "1000"
    mode: "0644"
    force: false
  become: true
  when: llamaswap_enabled | bool

- name: Install migrated CrispASR voice transcript
  ansible.builtin.copy:
    content: "{{ (llamaswap_crispasr_tts_voice_metadata.content | b64decode | from_json).reference_text }}\n"
    dest: "{{ llamaswap_crispasr_tts_voices_path }}/{{ llamaswap_crispasr_tts_voice }}.txt"
    owner: "1000"
    group: "1000"
    mode: "0644"
    force: false
  become: true
  when: llamaswap_enabled | bool

- name: Inspect Docker socket for llama-swap lifecycle management
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: llamaswap_docker_socket
  become: true
  when: llamaswap_enabled | bool

- name: Require Docker socket for llama-swap lifecycle management
  ansible.builtin.assert:
    that:
      - llamaswap_docker_socket.stat.exists
      - llamaswap_docker_socket.stat.gid is defined
    fail_msg: "llama-swap requires /var/run/docker.sock to manage CrispASR"
  when: llamaswap_enabled | bool

- name: Ensure llama-swap backend network exists
  community.docker.docker_network:
    name: "{{ llamaswap_backend_network }}"
    state: present
  become: true
  when: llamaswap_enabled | bool

- name: Pull pinned CrispASR image
  community.docker.docker_image:
    name: "{{ llamaswap_crispasr_image }}"
    source: pull
    state: present
  become: true
  when: llamaswap_enabled | bool

- name: Create llama-swap config file
  ansible.builtin.template:
    src: llamaswap_config.yaml.j2
    dest: "{{ llamaswap_config_path }}/config.yaml"
    mode: "0644"
  become: true
  notify: Restart llama-swap
  when: llamaswap_enabled | bool

- name: Pull pinned upstream llama-swap image
  community.docker.docker_image:
    name: "{{ llamaswap_image }}"
    source: pull
    state: present
  become: true
  notify: Restart llama-swap
  when: llamaswap_enabled | bool

- name: Remove stale llama-swap-managed audio containers before restart
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop:
    - "llamaswap-parakeet"
    - "{{ llamaswap_crispasr_container_name }}"
    - "{{ llamaswap_crispasr_tts_container_name }}"
  become: true
  when: llamaswap_enabled | bool

- name: Start the llama-swap container
  community.docker.docker_container:
    name: "{{ llamaswap_container_name }}"
    image: "{{ llamaswap_image }}"
    image_name_mismatch: recreate
    pull: false
    state: started
    restart_policy: unless-stopped
    # init: true → Docker injects tini as PID 1 to reap zombie children.
    # vLLM spawns EngineCore worker subprocesses that become defunct on
    # failure; without an init reaper they hold CUDA contexts (leaking
    # ~23 GB of GPU memory) until the container restarts. llama-swap is
    # PID 1 by default and does not reap.
    init: true
    ports:
      - "{{ llamaswap_port }}:8080"
    shm_size: "2g"
    volumes:
      - "{{ llamaswap_config_path }}/config.yaml:/app/config.yaml"
      - "{{ llamaswap_config_path }}/cache:/app/.cache"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/usr/bin/docker:/usr/bin/docker"
    groups:
      - "{{ llamaswap_docker_socket.stat.gid | string }}"
    networks:
      - name: "{{ llamaswap_backend_network }}"
    device_requests:
      - driver: nvidia
        # GPU2 is visible only for explicit 3-GPU profiles. Per-model
        # CUDA_VISIBLE_DEVICES keeps every existing LLM on the two 3090s.
        device_ids: ["{{ gpu_3090_0_uuid }}", "{{ gpu_3090_1_uuid }}", "{{ gpu_5060ti_uuid }}"]
        capabilities:
          - [gpu]
    capabilities:
      - SYS_NICE
    env:
      # The upstream image runs as root and otherwise resolves Hugging Face
      # downloads below /root/.cache, bypassing the persistent host cache.
      HOME: /app
      HF_HOME: /app/.cache/huggingface
      LLAMASWAP_RESTART_TOKEN: "{{ ansible_facts.date_time.epoch }}"
    labels:
      homepage.group: "{{ services['llama-swap'].group }}"
      homepage.name: "{{ services['llama-swap'].name }}"
      homepage.href: "https://{{ services['llama-swap'].domain }}"
      homepage.icon: llama.png
      homepage.server: "{{ inventory_hostname }}"
      homepage.container: "{{ llamaswap_container_name }}"
  become: true
  when: llamaswap_enabled | bool

- name: Apply pending llama-swap restart before warmup
  ansible.builtin.meta: flush_handlers

- name: Wait for llama-swap API before ASR warmup
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamaswap_port }}/health"
    method: GET
    status_code: 200
  register: llamaswap_health
  retries: 30
  delay: 2
  until: llamaswap_health.status == 200
  when:
    - llamaswap_enabled | bool
    - not ansible_check_mode

- name: Create short silent WAV for ASR warmup
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ llamaswap_container_name }}"
      - ffmpeg
      - -hide_banner
      - -loglevel
      - error
      - -f
      - lavfi
      - -i
      - anullsrc=r=16000:cl=mono
      - -t
      - "1"
      - -y
      - /tmp/asr-warmup.wav
  changed_when: false
  become: true
  when:
    - llamaswap_enabled | bool
    - not ansible_check_mode

- name: Warm CrispASR through llama-swap
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ llamaswap_container_name }}"
      - curl
      - --fail
      - --show-error
      - --silent
      - --max-time
      - "300"
      - -F
      - file=@/tmp/asr-warmup.wav
      - -F
      - model={{ model_group_alias['home-asr'] }}
      - http://127.0.0.1:8080/v1/audio/transcriptions
  register: llamaswap_crispasr_warmup
  changed_when: false
  retries: 3
  delay: 5
  until: llamaswap_crispasr_warmup.rc == 0
  become: true
  when:
    - llamaswap_enabled | bool
    - not ansible_check_mode
