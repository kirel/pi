---
- name: Create Caddy config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
    group: users
    mode: "2775"
  loop:
    - "{{ caddy_folder }}"
    - "{{ caddy_data_folder }}"
    - "{{ caddy_config_folder }}"

- name: Copy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_folder }}/Caddyfile"
    owner: "{{ username }}"
    mode: "0644"
  register: caddy_config_template

- name: Copy Dockerfile
  ansible.builtin.template:
    src: Dockerfile
    dest: "{{ caddy_folder }}/Dockerfile"
    owner: "{{ username }}"
    mode: "0644"
  register: caddy_dockerfile_template

- name: Inspect rendered Caddy Dockerfile
  ansible.builtin.stat:
    path: "{{ caddy_folder }}/Dockerfile"
    checksum_algorithm: sha256
  register: caddy_dockerfile_stat

- name: Read successful Caddy build checksum
  ansible.builtin.slurp:
    src: "{{ caddy_folder }}/.dockerfile-build.sha256"
  register: caddy_build_checksum
  failed_when: false
  changed_when: false

- name: Inspect local Caddy image
  community.docker.docker_image_info:
    name: caddy-caddy:latest
  register: caddy_image_info

- name: Determine whether Caddy needs an image rebuild
  ansible.builtin.set_fact:
    caddy_build_required: >-
      {{
        caddy_force_rebuild | bool
        or caddy_dockerfile_template.changed
        or caddy_image_info.images | length == 0
        or (
          caddy_build_checksum.content | default('') | b64decode | trim | length > 0
          and caddy_build_checksum.content | default('') | b64decode | trim
            != caddy_dockerfile_stat.stat.checksum
        )
      }}

- name: Start caddy
  community.docker.docker_compose_v2:
    project_name: caddy
    pull: "{{ 'always' if caddy_build_required else 'never' }}"
    build: "{{ 'always' if caddy_build_required else 'never' }}"
    state: present
    definition:
      # Networks are not used in host network mode for this service
      services:
        caddy:
          network_mode: host
          container_name: caddy
          build:
            context: "{{ caddy_folder }}"
            dockerfile: "{{ caddy_folder }}/Dockerfile"
          restart: unless-stopped
          user: "{{ uid }}:{{ uid }}"
          volumes:
            - "{{ caddy_folder }}/Caddyfile:/etc/caddy/Caddyfile"
            - "{{ caddy_data_folder }}:/data"
            - "{{ caddy_config_folder }}:/config"
          environment:
            CADDY_ADMIN: "0.0.0.0:2019"
            REGFISH_TOKEN: "{{ regfish_token }}"
          dns:
            - "{{ nameserver_pi_ip }}"
            - "{{ homelab_nuc_ip }}"
          cap_add:
            - NET_ADMIN
          labels:
            - homepage.group=Network
            - homepage.name=Caddy
            - homepage.icon=caddy.png
            - homepage.server={{ inventory_hostname }}
            - homepage.container=caddy
            - homepage.widget.type=caddy
            - homepage.widget.url=http://homelab-nuc.lan:2019 # Use host-resolvable name as Caddy is in host network mode

  register: caddy_compose

- name: Debug docker compose output
  ansible.builtin.debug:
    msg:
      rebuild_image: "{{ caddy_build_required }}"
      actions: "{{ caddy_compose.actions | default([]) }}"

- name: Assert caddy container is running
  ansible.builtin.assert:
    that:
      - caddy_compose.containers | selectattr('Name', 'equalto', 'caddy') | list | length > 0
      - caddy_compose.containers | selectattr('Name', 'equalto', 'caddy') | map(attribute='State') | list | first == 'running'

- name: Record successful Caddy build checksum
  ansible.builtin.copy:
    content: "{{ caddy_dockerfile_stat.stat.checksum }}\n"
    dest: "{{ caddy_folder }}/.dockerfile-build.sha256"
    owner: "{{ username }}"
    group: users
    mode: "0644"

- name: Validate Caddy configuration
  community.docker.docker_container_exec:
    container: caddy
    argv:
      - caddy
      - validate
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
  changed_when: caddy_config_template.changed
  notify: Reload Caddy

- name: Create symlink to root certificate from mounted data volume
  ansible.builtin.file:
    src: "{{ caddy_data_folder }}/caddy/pki/authorities/local/root.crt"
    dest: "{{ caddy_folder }}/root.crt"
    state: link
    owner: "{{ username }}"
    group: users

- name: Ensure Caddy PKI directories are world-executable for service mounts
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ username }}"
    group: users
  loop:
    - "{{ caddy_data_folder }}/caddy/pki"
    - "{{ caddy_data_folder }}/caddy/pki/authorities"
    - "{{ caddy_data_folder }}/caddy/pki/authorities/local"

- name: Ensure Caddy root certificate is world-readable for service mounts
  ansible.builtin.file:
    path: "{{ caddy_data_folder }}/caddy/pki/authorities/local/root.crt"
    mode: "0644"
    owner: "{{ username }}"
    group: users

- name: Fetch root certificate to controller for distribution
  ansible.builtin.fetch:
    src: "{{ caddy_folder }}/root.crt"
    dest: tmp/
    flat: true


# Note: The certificate is accessible via the mounted data volume at:
# {{ caddy_data_folder }}/caddy/pki/authorities/local/root.crt
# The symlink provides a convenient stable path at {{ caddy_folder }}/root.crt

# Note: Installing the cert into the host's trust store is now handled by the 'trust-internal-ca' role.
# The fetch task above provides the cert to the controller so it can be distributed to all hosts.
