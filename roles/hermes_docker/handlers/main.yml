---
- name: Recreate Hermes Docker agents
  community.docker.docker_compose_v2:
    project_src: "{{ hermes_docker_base_dir }}"
    files:
      - docker-compose.yml
    project_name: "{{ hermes_docker_project_name }}"
    state: present
    # Scoped configuration deploys reuse the existing image and leave peers running.
    services: "{{ hermes_docker_deploy_services | default(omit) }}"
    dependencies: "{{ false if hermes_docker_deploy_services is defined else omit }}"
    build: "{{ 'never' if hermes_docker_deploy_services is defined else 'always' }}"
    pull: "{{ 'never' if hermes_docker_deploy_services is defined else hermes_docker_compose_pull }}"
    recreate: auto
    remove_orphans: "{{ hermes_docker_deploy_services is not defined }}"
  become: true
  when: not ansible_check_mode
