---
- name: Configure Hausfee 1Password CLI and service account
  when: hermes_hausfee_enabled | bool and hermes_hausfee_onepassword_reference is defined
  block:
    - name: Create persistent private 1Password directory
      ansible.builtin.file:
        path: "{{ hermes_docker_base_dir }}/multipurpose/data/.config/op"
        state: directory
        owner: "{{ hermes_docker_data_uid }}"
        group: "{{ hermes_docker_data_gid }}"
        mode: '0700'

    - name: Install secure handover helper on Ailab
      ansible.builtin.copy:
        src: provision-hausfee-onepassword.py
        dest: /home/daniel/.local/bin/provision-hausfee-onepassword.py
        mode: '0700'
      delegate_to: ailab-ubuntu
      become: false

    - name: Transfer CLI and service token directly from Ailab to Hausfee
      ansible.builtin.command:
        argv: [python3, /home/daniel/.local/bin/provision-hausfee-onepassword.py]
        stdin: >-
          {{ {'target': 'daniel@' ~ hostvars[inventory_hostname].ansible_host,
              'version': hermes_hausfee_onepassword_cli_version,
              'reference': hermes_hausfee_onepassword_reference} | to_json }}
      delegate_to: ailab-ubuntu
      become: false
      register: hermes_hausfee_onepassword_handover
      changed_when: "'changed' in hermes_hausfee_onepassword_handover.stdout"
      no_log: true
      diff: false
      when: not ansible_check_mode

    - name: Create persistent CLI wrapper directory
      ansible.builtin.file:
        path: "{{ hermes_docker_base_dir }}/multipurpose/data/.local/bin"
        state: directory
        owner: "{{ hermes_docker_data_uid }}"
        group: "{{ hermes_docker_data_gid }}"
        mode: '0755'

    - name: Install automatically authenticated op command
      ansible.builtin.copy:
        dest: "{{ hermes_docker_base_dir }}/multipurpose/data/.local/bin/op"
        owner: "{{ hermes_docker_data_uid }}"
        group: "{{ hermes_docker_data_gid }}"
        mode: '0755'
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          export OP_SERVICE_ACCOUNT_TOKEN
          OP_SERVICE_ACCOUNT_TOKEN="$(</opt/data/.config/op/service-account-token)"
          exec /opt/data/.local/lib/1password/op "$@"

    - name: Verify Hausfee service-account authentication without logging account data
      ansible.builtin.command:
        argv: [docker, exec, --user, hermes, hermes-multipurpose, /opt/data/.local/bin/op, user, get, --me, --format, json]
      changed_when: false
      no_log: true
      diff: false
      when: not ansible_check_mode
