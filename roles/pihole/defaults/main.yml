---
# Default DNS servers to assign to clients tagged with 'nopihole'
google_dns_servers:
  - 8.8.8.8
  - 8.8.4.4

# Pi-hole cache and offline-resilience settings
pihole_cache_size: 10000
pihole_dns_forward_max: 1000
pihole_stale_cache_ttl: 43200

# Limit per-client query floods without reducing the global forwarding capacity.
pihole_rate_limit_count: 1000
pihole_rate_limit_interval: 60
