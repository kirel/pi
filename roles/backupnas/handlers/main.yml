---
- name: Reboot backup NAS
  ansible.builtin.reboot:
    reboot_timeout: 600
    msg: Applying Radxa Penta SATA HAT PCIe configuration

- name: Reload networkd for backup NAS Wi-Fi
  ansible.builtin.command: networkctl reload
  changed_when: true

- name: Reconfigure backup NAS Wi-Fi
  ansible.builtin.command: networkctl reconfigure wlan0
  changed_when: true
