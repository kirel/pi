---
- name: Create jellyfin folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ username }}"
  with_items:
    - "{{ jellyfin_config_folder }}"
    - "{{ jellyfin_movie_folder }}"
    - "{{ jellyfin_shows_folder }}"
    - "{{ jellyfin_music_folder }}"
    - "{{ navidrome_data_folder }}"

- name: Reposess jellyfin folders
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ username }}"
    group: users
    mode: u=rwx,g=rwxs
    recurse: true
  with_items:
    - "{{ jellyfin_config_folder }}"
    - "{{ jellyfin_movie_folder }}"
    - "{{ jellyfin_shows_folder }}"
    - "{{ jellyfin_music_folder }}"
    - "{{ navidrome_data_folder }}"

- name: Inspect Jellyfin Quick Sync render device
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: media_jellyfin_render_device

- name: Require Jellyfin Quick Sync render device
  ansible.builtin.assert:
    that:
      - media_jellyfin_render_device.stat.exists
      - media_jellyfin_render_device.stat.ischr
    fail_msg: Intel Quick Sync render device /dev/dri/renderD128 is unavailable

- name: Start media services
  community.docker.docker_compose_v2:
    project_name: jellyfin
    pull: always # Set to "always", "missing", "never", or "policy" based on your needs
    state: present # Ensure the services are started
    definition:
      services:
        jellyfin:
          image: jellyfin/jellyfin
          container_name: jellyfin
          user: "{{ uid }}:{{ uid }}"
          group_add:
            - "{{ media_jellyfin_render_device.stat.gid }}"
          devices:
            - /dev/dri/renderD128:/dev/dri/renderD128
          network_mode: host
          pull_policy: always
          volumes:
            - "{{ jellyfin_config_folder }}:/config"
            - jellyfin-cache:/cache
            - "{{ jellyfin_movie_folder }}:/movies"
            - "{{ jellyfin_shows_folder }}:/shows"
            - "{{ jellyfin_music_folder }}:/music"
            - /etc/ssl/certs:/etc/ssl/certs:ro
            - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
          restart: unless-stopped
          # Optional - alternative address used for autodiscovery
          environment:
            JELLYFIN_PublishedServerUrl: http://192.168.50.5:8096
            SSL_CA_FILE: /etc/ssl/certs/ca-certificates.crt
          # Optional - may be necessary for docker healthcheck to pass if running in host network mode
          extra_hosts:
            host.docker.internal: host-gateway
          labels:
            homepage.group: "{{ services.jellyfin.group }}"
            homepage.name: jellyfin
            homepage.href: http://{{ services['jellyfin'].domain }}
            homepage.icon: jellyfin.png
            homepage.server: "{{ inventory_hostname }}"
            homepage.container: jellyfin
            homepage.widget.type: jellyfin
            homepage.widget.url: http://192.168.50.5:8096
            homepage.widget.key: "{{ jellyfin_api_key }}"

        navidrome:
          image: deluan/navidrome:latest
          container_name: navidrome
          user: "{{ uid }}:{{ uid }}" # should be owner of volumes
          ports:
            - "{{ navidrome_http_port }}:4533"
          restart: unless-stopped
          volumes:
            - "{{ navidrome_data_folder }}:/data"
            - "{{ jellyfin_music_folder }}:/music:ro"
          labels:
            homepage.group: "{{ services.music.group }}"
            homepage.name: Navidrome
            homepage.href: https://{{ services.music.domain }}
            homepage.icon: navidrome.png
            homepage.server: "{{ inventory_hostname }}"
            homepage.container: navidrome
            homepage.widget.type: navidrome
            homepage.widget.url: https://music.lan
            homepage.widget.user: daniel
            homepage.widget.token: "{{ navidrome_token }}"
            homepage.widget.salt: "{{ navidrome_salt }}"

      volumes:
        jellyfin-cache: {} # Define the volume

- name: Ensure Jellyfin transcode cache is writable
  community.docker.docker_container_exec:
    container: jellyfin
    user: "0"
    argv:
      - sh
      - -c
      - |
        current="$(stat -c '%u:%g:%a' /cache/transcodes 2>/dev/null || true)"
        if [ "$current" != "{{ uid }}:{{ uid }}:755" ]; then
          mkdir -p /cache/transcodes
          chown "{{ uid }}:{{ uid }}" /cache/transcodes
          chmod 0755 /cache/transcodes
          echo changed
        fi
  register: jellyfin_transcode_cache
  changed_when: "'changed' in jellyfin_transcode_cache.stdout"

- name: Read Jellyfin encoding configuration
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_http_port }}/System/Configuration/encoding"
    method: GET
    headers:
      X-Emby-Token: "{{ jellyfin_api_key }}"
    return_content: true
    status_code:
      - 200
      - 503
  register: media_jellyfin_encoding_configuration
  until: media_jellyfin_encoding_configuration.status == 200
  retries: 30
  delay: 2
  no_log: true

- name: Enable Intel Quick Sync in Jellyfin
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ jellyfin_http_port }}/System/Configuration/encoding"
    method: POST
    headers:
      X-Emby-Token: "{{ jellyfin_api_key }}"
    body_format: json
    body: "{{ media_jellyfin_encoding_configuration.json | combine(media_jellyfin_quicksync_configuration) }}"
    status_code: 204
  when: >-
    media_jellyfin_encoding_configuration.json.HardwareAccelerationType != 'qsv' or
    not media_jellyfin_encoding_configuration.json.EnableHardwareEncoding
  no_log: true
  vars:
    media_jellyfin_quicksync_configuration:
      HardwareAccelerationType: qsv
      EnableHardwareEncoding: true
