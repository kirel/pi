---
- name: Validate managed LiteLLM virtual-key teams
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.team_id is defined
      - item.value.team_id | string | length > 0
      - item.value.models is defined
      - item.value.models is sequence
      - item.value.models is not string
      - item.value.object_permission | default({}) is mapping
    fail_msg: >-
      Managed LiteLLM team '{{ item.key }}' must define team_id, models, and
      optional object_permission with valid types.
  loop: "{{ litellm_managed_virtual_key_teams | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Validate managed LiteLLM virtual keys
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value.key is defined
      - item.value.key | string is match('^sk-.+')
      - item.value.key_alias is defined
      - item.value.key_alias | string | length > 0
      - item.value.team_id is defined
      - item.value.team_id | string | length > 0
      - item.value.models is defined
      - item.value.models is sequence
      - item.value.models is not string
      - item.value.mcp_access_groups is defined
      - item.value.mcp_access_groups is sequence
      - item.value.mcp_access_groups is not string
      - item.value.mcp_tool_permissions | default({}) is mapping
    fail_msg: >-
      Managed LiteLLM key '{{ item.key }}' must define key, key_alias, team_id,
      models, mcp_access_groups, and optional mcp_tool_permissions with valid
      types.
  loop: "{{ litellm_managed_virtual_keys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Manage LiteLLM virtual keys
  no_log: true
  block:
    - name: Look up managed LiteLLM virtual-key teams
      ansible.builtin.uri:
        url: "{{ litellm_managed_keys_api_base_url }}/team/info?team_id={{ item.value.team_id | urlencode }}"
        method: GET
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
        return_content: true
        status_code:
          - 200
          - 404
      loop: "{{ litellm_managed_virtual_key_teams | dict2items }}"
      register: llm_tools_managed_team_lookups
      loop_control:
        label: "{{ item.value.team_id }}"

    - name: Create missing managed LiteLLM virtual-key teams
      ansible.builtin.uri:
        url: "{{ litellm_managed_keys_api_base_url }}/team/new"
        method: POST
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
        body_format: json
        body: "{{ item.item.value }}"
        return_content: true
        status_code: 200
      loop: "{{ llm_tools_managed_team_lookups.results }}"
      loop_control:
        label: "{{ item.item.value.team_id }}"
      when: item.status == 404

    - name: Update managed LiteLLM virtual-key teams
      ansible.builtin.uri:
        url: "{{ litellm_managed_keys_api_base_url }}/team/update"
        method: POST
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
        body_format: json
        body: "{{ item.item.value }}"
        return_content: true
        status_code: 200
      loop: "{{ llm_tools_managed_team_lookups.results }}"
      loop_control:
        label: "{{ item.item.value.team_id }}"
      when: item.status == 200

    - name: Look up managed LiteLLM virtual keys
      ansible.builtin.uri:
        url: "{{ litellm_managed_keys_api_base_url }}/key/list?key_alias={{ item.value.key_alias | urlencode }}&return_full_object=true&size=100"
        method: GET
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
        return_content: true
        status_code: 200
      loop: "{{ litellm_managed_virtual_keys | dict2items }}"
      register: llm_tools_managed_key_lookups
      loop_control:
        label: "{{ item.value.key_alias }}"

    - name: Create missing managed LiteLLM virtual keys
      ansible.builtin.uri:
        url: "{{ litellm_managed_keys_api_base_url }}/key/generate"
        method: POST
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
        body_format: json
        body:
          key: "{{ item.item.value.key }}"
          key_alias: "{{ item.item.value.key_alias }}"
          team_id: "{{ item.item.value.team_id }}"
          agent_id: "{{ item.item.value.agent_id | default(none) }}"
          models: "{{ item.item.value.models }}"
          object_permission:
            mcp_access_groups: "{{ item.item.value.mcp_access_groups }}"
            mcp_servers: "{{ item.item.value.mcp_servers | default([]) }}"
            mcp_tool_permissions: "{{ item.item.value.mcp_tool_permissions | default({}) }}"
        return_content: true
        status_code: 200
      vars:
        exact_alias_matches: >-
          {{
            item.json['keys'] | default([]) |
            selectattr('key_alias', 'defined') |
            selectattr('key_alias', 'equalto', item.item.value.key_alias) |
            list
          }}
      loop: "{{ llm_tools_managed_key_lookups.results }}"
      loop_control:
        label: "{{ item.item.value.key_alias }}"
      when: exact_alias_matches | length == 0

    - name: Update managed LiteLLM virtual keys
      ansible.builtin.uri:
        url: "{{ litellm_managed_keys_api_base_url }}/key/update"
        method: POST
        headers:
          Authorization: "Bearer {{ litellm_master_key }}"
        body_format: json
        body:
          key: "{{ item.value.key }}"
          key_alias: "{{ item.value.key_alias }}"
          team_id: "{{ item.value.team_id }}"
          agent_id: "{{ item.value.agent_id | default(none) }}"
          models: "{{ item.value.models }}"
          object_permission:
            mcp_access_groups: "{{ item.value.mcp_access_groups }}"
            mcp_servers: "{{ item.value.mcp_servers | default([]) }}"
            mcp_tool_permissions: "{{ item.value.mcp_tool_permissions | default({}) }}"
        return_content: true
        status_code: 200
      loop: "{{ litellm_managed_virtual_keys | dict2items }}"
      loop_control:
        label: "{{ item.value.key_alias }}"
