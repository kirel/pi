---
- name: Reconcile Regfish DNS once from the controller
  run_once: true
  delegate_to: localhost
  become: false
  block:
    - name: Validate and assemble zone and service records
      ansible.builtin.set_fact:
        _regfish_desired: "{{ regfish_dns_zones | regfish_dns_catalog(services | default({})) }}"

    - name: Read current Regfish records (also in check mode)
      ansible.builtin.uri:
        url: "https://api.regfish.com/dns/{{ item }}/rr"
        headers:
          x-api-key: "{{ regfish_dns_api_key }}"
        follow_redirects: none
        return_content: true
      loop: "{{ _regfish_desired.keys() | list }}"
      register: _regfish_read
      check_mode: false
      changed_when: false
      failed_when: >-
        _regfish_read.status != 200 or
        not (_regfish_read.json.success | default(false)) or
        _regfish_read.json.response is not defined
      no_log: true
      diff: false

    - name: Build the complete plan before any writes
      ansible.builtin.set_fact:
        _regfish_plan: >-
          {{ _regfish_desired | regfish_dns_plan(
             dict(_regfish_read.results | map(attribute='item') |
                  zip(_regfish_read.results | map(attribute='json.response')))) }}

    - name: Show DNS plan and inventory drift
      ansible.builtin.debug:
        var: _regfish_plan
      changed_when: _regfish_plan.changes | length > 0

    - name: Apply explicit DNS changes
      ansible.builtin.uri:
        url: "https://api.regfish.com{{ item.path }}"
        method: "{{ item.method }}"
        headers:
          x-api-key: "{{ regfish_dns_api_key }}"
        follow_redirects: none
        body_format: json
        body: "{{ item.body | default(omit) }}"
        return_content: true
      loop: "{{ _regfish_plan.changes }}"
      register: _regfish_write
      when: not ansible_check_mode
      changed_when: true
      failed_when: >-
        _regfish_write.status != 200 or
        not (_regfish_write.json.success | default(false))
      no_log: true
      diff: false

    - name: Read back records after changes
      ansible.builtin.uri:
        url: "https://api.regfish.com/dns/{{ item }}/rr"
        headers:
          x-api-key: "{{ regfish_dns_api_key }}"
        follow_redirects: none
        return_content: true
      loop: "{{ _regfish_desired.keys() | list }}"
      register: _regfish_verify
      when: not ansible_check_mode and _regfish_plan.changes | length > 0
      changed_when: false
      failed_when: >-
        _regfish_verify.status != 200 or
        not (_regfish_verify.json.success | default(false)) or
        _regfish_verify.json.response is not defined
      no_log: true
      diff: false

    - name: Verify that managed records converged
      ansible.builtin.assert:
        that: _regfish_remaining.changes | length == 0
        fail_msg: "Regfish did not converge; run --check to inspect the remaining plan."
      vars:
        _regfish_remaining: >-
          {{ _regfish_desired | regfish_dns_plan(
             dict(_regfish_verify.results | map(attribute='item') |
                  zip(_regfish_verify.results | map(attribute='json.response')))) }}
      when: not ansible_check_mode and _regfish_plan.changes | length > 0
