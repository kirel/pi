llamaswap_enabled: true

model_group_alias:
  home: "Qwen3.6-35B-A3B-Instruct-nothink"
  home-fast: "Qwen3.8-27B-Instruct-nothink"
  home-smart: "Qwen3.8-27B-Instruct"
  home-vision: "Qwen3.8-27B-Instruct"
  home-ha: "Qwen3.8-27B-Instruct-nothink"
  home-hermes: "Qwen3.8-27B-Instruct-nothink"
  home-embed: "qwen3-embedding"
  home-asr: "whisper-large-v3-turbo-q8-crispasr"
  home-tts: "qwen3-tts"
  home-tts-design: "qwen3-tts-design"
  home-remote: "google/gemini-3-flash-preview"

# llama.cpp --fit is not implemented for tensor split mode. Keep the total KV
# pools explicit so qwen3-embedding, CrispASR, and qwen3-tts can stay resident
# with at least the existing GPU headroom. Unified KV lets three concurrent
# sequences share each pool instead of dividing it into equal per-slot contexts.
llama_parallel_slots: 3
llama_prompt_cache_ram_mib: 8192
llama_native_context_qwen36: 262144
llama_native_context_qwen38: 262144
llama_native_context_gemma4: 262144
llama_native_context_muse_glimmer: 131072
# The dense 27B has a substantially larger KV footprint per token. The 35B
# uses the same conservative pool so GPU1 keeps its reserve after TTS JIT.
llama_ctx_size_qwen35_3090: 376832
llama_ctx_size_qwen27_3090: 376832
llama_ctx_size_laguna_s_3090: 16384
# Conservative advertised context for the 3-GPU IQ3_S profile. Runtime --fit
# selected 120320-133120 across tested starts while keeping all services resident.
llama_ctx_size_laguna_s_3gpu: 120320
llama_ctx_size_gemma4_12b_3090: 140000
llama_ctx_size_gemma4_26b_3090: 376832
# The dense 31B plus its MTP/mmproj only preserves the required resident-service
# headroom at 128K. 262K leaves GPU0 effectively full; 376832 fails to start.
llama_ctx_size_gemma4_31b_3090: 131072
llama_n_predict_3090: 32768
llama_n_predict_laguna_s_3090: 8192

litellm_fallbacks:
  - home: ["home-remote"]
  - home-fast: ["home-remote"]
  - home-smart: ["home-remote"]

openrouter_models:
  - openai/gpt-5.5
  - anthropic/claude-haiku-4.5
  - anthropic/claude-sonnet-4.6
  - anthropic/claude-opus-4.8
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-v4-pro
  - google/gemini-3.5-flash
  - google/gemini-3.1-flash-lite

litellm_extra_models:
  # CLIProxyAPI is exposed to LiteLLM as an OpenAI-compatible upstream. Keep
  # the public aliases suffixed with -cpa so callers can select this quota pool
  # explicitly and usage remains attributable in both LiteLLM and Usage Keeper.
  - model_name: gpt-5.6-sol-cpa
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  - model_name: gpt-5.6-terra-cpa
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  - model_name: gpt-5.6-luna-cpa
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  - model_name: gpt-5.5-cpa
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  - model_name: claude-opus-4-6-thinking-cpa
    litellm_params:
      model: openai/claude-opus-4-6-thinking
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  - model_name: gemini-3.1-pro-low-cpa
    litellm_params:
      model: openai/gemini-3.1-pro-low
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  - model_name: gemini-3.6-flash-high-cpa
    litellm_params:
      model: openai/gemini-3.6-flash-high
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  - model_name: grok-4.5-cpa
    litellm_params:
      model: openai/grok-4.5
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"

  # Media models must declare their endpoint mode. They are invoked through
  # LiteLLM's native image/video APIs, not through /chat/completions.
  - model_name: gpt-image-2-cpa
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"
    model_info:
      mode: image_generation

  # Hermes' native OpenAI image provider sends the upstream model name
  # verbatim, so expose the same CPA backend without the routing suffix too.
  - model_name: gpt-image-2
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"
    model_info:
      mode: image_generation

  - model_name: gemini-3.1-flash-image-cpa
    litellm_params:
      model: openai/gemini-3.1-flash-image
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"
    model_info:
      mode: image_generation

  - model_name: grok-imagine-image-cpa
    litellm_params:
      model: openai/grok-imagine-image
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"
    model_info:
      mode: image_generation

  - model_name: grok-imagine-image-quality-cpa
    litellm_params:
      model: openai/grok-imagine-image-quality
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"
    model_info:
      mode: image_generation

  - model_name: grok-imagine-video-cpa
    litellm_params:
      model: openai/grok-imagine-video
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"
    model_info:
      mode: video_generation

  - model_name: grok-imagine-video-1.5-preview-cpa
    litellm_params:
      model: openai/grok-imagine-video-1.5-preview
      api_key: os.environ/CPA_API_KEY
      api_base: "http://{{ homelab_nuc_ip }}:{{ cpa_http_port }}/v1"
    model_info:
      mode: video_generation

  - model_name: minimax-m3
    litellm_params:
      model: minimax/MiniMax-M3
      api_key: os.environ/MINIMAX_API_KEY
      api_base: https://api.minimax.io/v1
    # MiniMax-M3 is a reasoning-capable multimodal model (per pi-ai catalog);
    # declare capabilities so LiteLLM reports them via /model/info and clients
    # like pi-provider-litellm enable thinking/vision instead of falling back
    # to supports_reasoning=false on /v1/models-only discovery.
    model_info:
      supports_reasoning: true
      supports_vision: true

  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/coding/paas/v4
    # GLM-5.2 supports extended thinking (zai thinkingFormat); LiteLLM's
    # /v1/models fallback doesn't expose supports_reasoning, so declare it
    # here. The zai compat/thinkingFormat is matched by pi via the catalog id.
    model_info:
      supports_reasoning: true

  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_key: os.environ/ZAI_API_KEY
      api_base: https://api.z.ai/api/coding/paas/v4
      # Hermes speaks the Responses API, while Z.AI's coding endpoint exposes
      # Chat Completions. Ask LiteLLM to bridge /responses to /chat/completions.
      use_chat_completions_api: true
    # Keep the same OpenAI-compatible Z.AI coding endpoint and explicit
    # reasoning capability as GLM-5.2. The live Z.AI model catalog exposes
    # glm-5.3 on this endpoint.
    model_info:
      supports_reasoning: true

llamaswap_models:
  # Keep public model IDs stable once exposed via LiteLLM/LlamaSwap.
  # Existing aliases are mixed-case because clients may already depend on them.
  # For new entries, prefer the upstream model family name plus a backend suffix
  # only when we expose multiple runtimes of the same base model.

  - alias: Qwen3.6-35B-A3B-Instruct
    # Keep the proven total KV budget, but share it dynamically across three
    # concurrent sequences. Idle histories are moved to the host prompt cache
    # and selected automatically by prefix similarity. Q6_K was validated with
    # parallel LLM, TTS, ASR, and embedding requests (minimum free: GPU0
    # 2145 MiB, GPU1 1008 MiB).
    cmd: >-
      /app/llama-server
      -hf unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q6_K
      --port ${PORT}
      --ctx-size {{ llama_ctx_size_qwen35_3090 }}
      --parallel {{ llama_parallel_slots }}
      --kv-unified
      --cache-ram {{ llama_prompt_cache_ram_mib }}
      --cache-idle-slots
      --n-predict {{ llama_n_predict_3090 }}
      --n-gpu-layers 99
      -sm tensor
      --fit off
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 1.5
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --chat-template-kwargs '{"preserve_thinking": true}'
      --jinja
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    context_window: "{{ llama_native_context_qwen36 }}"
    max_input_tokens: "{{ llama_native_context_qwen36 }}"
    max_output_tokens: "{{ llama_n_predict_3090 }}"
    allowed_openai_params:
      - extra_body
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}}"
    variants:
      nothink:
        temperature: 0.7
        top_p: 0.8
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            enable_thinking: false

  - alias: Qwen3.8-27B-Instruct
    # Use the same dynamic three-sequence layout and total KV budget as the 35B
    # model. Dynamic 3.0 UD-Q6_K_M is the closest size match to the previous
    # Q6_K and preserves its runtime headroom alongside the resident services.
    cmd: >-
      /app/llama-server
      -hf unsloth/Qwen3.8-27B-GGUF:UD-Q6_K_M
      --port ${PORT}
      --ctx-size {{ llama_ctx_size_qwen27_3090 }}
      --parallel {{ llama_parallel_slots }}
      --kv-unified
      --cache-ram {{ llama_prompt_cache_ram_mib }}
      --cache-idle-slots
      --n-predict {{ llama_n_predict_3090 }}
      --n-gpu-layers 99
      -sm tensor
      --fit off
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --presence-penalty 0.0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --chat-template-kwargs '{"preserve_thinking": true}'
      --jinja
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    context_window: "{{ llama_native_context_qwen38 }}"
    max_input_tokens: "{{ llama_native_context_qwen38 }}"
    max_output_tokens: "{{ llama_n_predict_3090 }}"
    allowed_openai_params:
      - extra_body
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}}"
    variants:
      low:
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            reasoning_effort: low
      medium:
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            reasoning_effort: medium
      nothink:
        temperature: 0.7
        top_p: 0.8
        presence_penalty: 1.5
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            enable_thinking: false

  - alias: Muse-Glimmer-30B
    # Use Meta's matched target, vision projector, and DFlash sidecar. Current
    # llama.cpp resolves mmproj-kquant.gguf and dflash-kquant.gguf from this HF
    # repo when the target file and speculative type are explicit.
    cmd: >-
      /app/llama-server
      -hf meta-models/Muse-Glimmer-30B-GGUF
      -hff muse-glimmer-30B-kquant-dynamic.gguf
      --port ${PORT}
      --ctx-size {{ llama_native_context_muse_glimmer }}
      --parallel {{ llama_parallel_slots }}
      --kv-unified
      --cache-ram {{ llama_prompt_cache_ram_mib }}
      --cache-idle-slots
      --n-predict {{ llama_n_predict_3090 }}
      --n-gpu-layers 99
      -sm tensor
      --fit off
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --spec-type draft-dflash
      --spec-draft-ngl 99
      --jinja
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    context_window: "{{ llama_native_context_muse_glimmer }}"
    max_input_tokens: "{{ llama_native_context_muse_glimmer }}"
    max_output_tokens: "{{ llama_n_predict_3090 }}"
    allowed_openai_params:
      - extra_body
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}}"
    variants:
      low:
        extra_body:
          chat_template_kwargs:
            reasoning_strength: low
      medium:
        extra_body:
          chat_template_kwargs:
            reasoning_strength: medium
      high:
        extra_body:
          chat_template_kwargs:
            reasoning_strength: high
      xhigh:
        extra_body:
          chat_template_kwargs:
            reasoning_strength: xhigh

  - alias: Laguna-S-2.1
    # Laguna S 2.1 is a 118B-A8B MoE. IQ2_M leaves only a few GiB beyond
    # its weights while embedding, ASR, and TTS remain resident, so start
    # with one slot, a 16K KV pool, and conservative compute batches.
    cmd: >-
      /app/llama-server
      -hf unsloth/Laguna-S-2.1-GGUF:UD-IQ2_M
      --port ${PORT}
      --ctx-size {{ llama_ctx_size_laguna_s_3090 }}
      --parallel 1
      --n-predict {{ llama_n_predict_laguna_s_3090 }}
      --batch-size 512
      --ubatch-size 256
      --n-gpu-layers 99
      -sm tensor
      --fit off
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --temp 1.0
      --top-p 0.95
      --top-k 40
      --chat-template-kwargs '{"preserve_thinking": true}'
      --jinja
    supports_function_calling: true
    supports_vision: false
    supports_reasoning: true
    context_window: "{{ llama_ctx_size_laguna_s_3090 }}"
    max_input_tokens: "{{ llama_ctx_size_laguna_s_3090 }}"
    max_output_tokens: "{{ llama_n_predict_laguna_s_3090 }}"
    allowed_openai_params:
      - extra_body
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}}"
    variants:
      nothink:
        temperature: 0.7
        top_p: 0.8
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            enable_thinking: false

  - alias: Laguna-S-2.1-3GPU
    # Higher-quality Laguna profile using the 5060 Ti as a smaller layer
    # segment. Layer split avoids tensor-parallel synchronization over the
    # eGPU link. The updated IQ3_S GGUF requires 4096 MiB target headroom on
    # GPU1 for concurrent TTS and fits 99072 tokens; this passed two parallel
    # LLM/TTS/ASR/embedding runs. Leave the layer count unset so llama.cpp can
    # account for the large fixed tensors.
    cmd: >-
      /app/llama-server
      -hf unsloth/Laguna-S-2.1-GGUF:UD-IQ3_S
      --port ${PORT}
      --parallel 1
      --n-predict {{ llama_n_predict_laguna_s_3090 }}
      --batch-size 512
      --ubatch-size 256
      --split-mode layer
      --fit on
      --fit-target 1024,4096,512
      --fit-ctx {{ llama_ctx_size_laguna_s_3090 }}
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --temp 1.0
      --top-p 0.95
      --top-k 40
      --chat-template-kwargs '{"preserve_thinking": true}'
      --jinja
    supports_function_calling: true
    supports_vision: false
    supports_reasoning: true
    context_window: "{{ llama_ctx_size_laguna_s_3gpu }}"
    max_input_tokens: "{{ llama_ctx_size_laguna_s_3gpu }}"
    max_output_tokens: "{{ llama_n_predict_laguna_s_3090 }}"
    allowed_openai_params:
      - extra_body
    # Share the existing swap group so starting this profile stops any
    # two-GPU LLM before the 3-GPU process allocates its weights.
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}},{{gpu_5060ti_uuid}}"
    variants:
      nothink:
        temperature: 0.7
        top_p: 0.8
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            enable_thinking: false

  - alias: Gemma-4-12B-it
    # Audio-capable Gemma 4 test profile. The same llama-server handles normal
    # chat and OpenAI-compatible /v1/audio/transcriptions requests; -hf also
    # selects the matching multimodal projector and MTP draft from this repo.
    # Keep Think/NoThink as request variants of this single backend so both
    # names share the model process and prompt cache.
    cmd: >-
      /app/llama-server
      -hf unsloth/gemma-4-12b-it-GGUF:Q8_0
      --port ${PORT}
      --ctx-size {{ llama_ctx_size_gemma4_12b_3090 }}
      --parallel {{ llama_parallel_slots }}
      --kv-unified
      --cache-ram {{ llama_prompt_cache_ram_mib }}
      --cache-idle-slots
      --batch-size 256
      --ubatch-size 256
      --n-predict {{ llama_n_predict_3090 }}
      --n-gpu-layers 99
      -sm layer
      --fit off
      -fa on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --reasoning on
      --jinja
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    context_window: "{{ llama_ctx_size_gemma4_12b_3090 }}"
    max_input_tokens: "{{ llama_ctx_size_gemma4_12b_3090 }}"
    max_output_tokens: "{{ llama_n_predict_3090 }}"
    allowed_openai_params:
      - extra_body
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}}"
    variants:
      nothink:
        temperature: 1.0
        top_p: 0.95
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            enable_thinking: false

  - alias: Gemma-4-26B-A4B-it-qat
    # Gemma 4 QAT uses one recommended GGUF quant (UD-Q4_K_XL). The same
    # Hugging Face repo includes mtp-* GGUFs, and current llama.cpp enables
    # Gemma MTP from -hf plus --spec-type draft-mtp without a separate draft HF.
    cmd: >-
      /app/llama-server
      -hf unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
      --port ${PORT}
      --ctx-size {{ llama_ctx_size_gemma4_26b_3090 }}
      --parallel {{ llama_parallel_slots }}
      --kv-unified
      --cache-ram {{ llama_prompt_cache_ram_mib }}
      --cache-idle-slots
      --n-predict {{ llama_n_predict_3090 }}
      --n-gpu-layers 99
      -sm tensor
      --fit off
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --spec-type draft-mtp
      --spec-draft-n-max 4
      --reasoning on
      --jinja
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    context_window: "{{ llama_native_context_gemma4 }}"
    max_input_tokens: "{{ llama_native_context_gemma4 }}"
    max_output_tokens: "{{ llama_n_predict_3090 }}"
    allowed_openai_params:
      - extra_body
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}}"
    variants:
      nothink:
        temperature: 1.0
        top_p: 0.95
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            enable_thinking: false

  - alias: Gemma-4-31B-it-qat
    # Gemma 4 QAT 31B with same-repo mtp-* GGUF auto-loaded by llama.cpp
    # from -hf plus --spec-type draft-mtp.
    cmd: >-
      /app/llama-server
      -hf unsloth/gemma-4-31B-it-qat-GGUF:UD-Q4_K_XL
      --port ${PORT}
      --ctx-size {{ llama_ctx_size_gemma4_31b_3090 }}
      --parallel {{ llama_parallel_slots }}
      --kv-unified
      --cache-ram {{ llama_prompt_cache_ram_mib }}
      --cache-idle-slots
      --n-predict {{ llama_n_predict_3090 }}
      --n-gpu-layers 99
      -sm tensor
      --fit off
      -fa on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --spec-type draft-mtp
      --spec-draft-n-max 4
      --reasoning on
      --jinja
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    context_window: "{{ llama_ctx_size_gemma4_31b_3090 }}"
    max_input_tokens: "{{ llama_ctx_size_gemma4_31b_3090 }}"
    max_output_tokens: "{{ llama_n_predict_3090 }}"
    allowed_openai_params:
      - extra_body
    group: "3090"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}},{{gpu_3090_1_uuid}}"
    variants:
      nothink:
        temperature: 1.0
        top_p: 0.95
        extra_body:
          cache_prompt: true
          chat_template_kwargs:
            enable_thinking: false


  - alias: qwen3-embedding
    # Default embedding runtime: enough headroom for ~400 token chunks plus
    # wrappers/metadata without reserving long-document KV by default.
    # Lower-memory fallback: 2048/512/512. Long-document case: 8192/2048/2048.
    cmd: >-
      /app/llama-server
      -hf PeterAM4/Qwen3-Embedding-0.6B-GGUF:Q4_K_M-imat
      --port ${PORT}
      --embeddings
      --ctx-size 4096
      --batch-size 1024
      --ubatch-size 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      --n-gpu-layers 99
    supports_function_calling: false
    supports_vision: false
    supports_reasoning: false
    context_window: 4096
    max_input_tokens: 4096
    encoding_format: "float"
    group: "forever"
    env:
      - "CUDA_VISIBLE_DEVICES={{gpu_3090_0_uuid}}"

  - alias: whisper-large-v3-turbo-q8-crispasr
    # OpenAI-compatible CrispASR sibling managed by llama-swap. Keep the exact
    # Whisper filename explicit: CrispASR 0.8.23 resolves unknown shorthand
    # names to Whisper Base.
    cmd: >-
      docker run
      --init
      --rm
      --pull never
      --name {{ llamaswap_crispasr_container_name }}
      --label io.kirelabs.managed-by=llama-swap
      --log-driver local
      --log-opt max-size=10m
      --log-opt max-file=3
      --network {{ llamaswap_backend_network }}
      --gpus device={{ llamaswap_crispasr_gpu_uuid }}
      -p {{ llamaswap_crispasr_wyoming_port }}:{{ llamaswap_crispasr_wyoming_port }}
      -v {{ llamaswap_crispasr_cache_path }}:{{ llamaswap_crispasr_cache_container_path }}
      --entrypoint crispasr
      {{ llamaswap_crispasr_image }}
      --server
      --host 0.0.0.0
      --port {{ llamaswap_crispasr_internal_port }}
      --wyoming-port {{ llamaswap_crispasr_wyoming_port }}
      --cache-dir {{ llamaswap_crispasr_cache_container_path }}
      --backend whisper
      --hf-repo {{ llamaswap_crispasr_model_repo }}:{{ llamaswap_crispasr_model_file }}
      --server-workers {{ llamaswap_crispasr_workers }}
      --language de
    cmd_stop: >-
      docker stop --time 15 {{ llamaswap_crispasr_container_name }}
    proxy: "http://{{ llamaswap_crispasr_container_name }}:{{ llamaswap_crispasr_internal_port }}"
    check_endpoint: "/health"
    supports_function_calling: false
    supports_vision: false
    supports_reasoning: false
    mode: audio_transcription
    group: "asr"

  - alias: qwen3-tts
    # OpenAI-compatible CrispASR Qwen3-TTS sibling. The stable de-host reference
    # is migrated from the previous faster-qwen3-tts cache during deployment.
    aliases:
      - home-tts
    use_model_name: qwen3-tts
    cmd: >-
      docker run
      --init
      --rm
      --pull never
      --name {{ llamaswap_crispasr_tts_container_name }}
      --label io.kirelabs.managed-by=llama-swap
      --log-driver local
      --log-opt max-size=10m
      --log-opt max-file=3
      --network {{ llamaswap_backend_network }}
      --gpus device={{ llamaswap_crispasr_tts_gpu_uuid }}
      -v {{ llamaswap_crispasr_tts_cache_path }}:{{ llamaswap_crispasr_tts_cache_container_path }}
      -v {{ llamaswap_crispasr_tts_voices_path }}:{{ llamaswap_crispasr_tts_voices_container_path }}:ro
      --entrypoint crispasr
      {{ llamaswap_crispasr_image }}
      --server
      --host 0.0.0.0
      --port {{ llamaswap_crispasr_tts_internal_port }}
      --cache-dir {{ llamaswap_crispasr_tts_cache_container_path }}
      --backend {{ llamaswap_crispasr_tts_backend }}
      -m auto
      --voice-dir {{ llamaswap_crispasr_tts_voices_container_path }}
      --language de
      --i-have-rights
    cmd_stop: >-
      docker stop --time 15 {{ llamaswap_crispasr_tts_container_name }}
    proxy: "http://{{ llamaswap_crispasr_tts_container_name }}:{{ llamaswap_crispasr_tts_internal_port }}"
    check_endpoint: "/health"
    supports_function_calling: false
    supports_vision: false
    supports_reasoning: false
    mode: audio_speech
    group: "tts"

  - alias: qwen3-tts-design
    # VoiceDesign is a separate Qwen3-TTS checkpoint. It shares GPU1 and the
    # model cache with the Base backend, and LlamaSwap swaps the two members of
    # the exclusive tts group according to the requested model.
    aliases:
      - home-tts-design
    use_model_name: qwen3-tts-design
    allowed_openai_params:
      - instructions
    cmd: >-
      docker run
      --init
      --rm
      --pull never
      --name {{ llamaswap_crispasr_tts_design_container_name }}
      --label io.kirelabs.managed-by=llama-swap
      --log-driver local
      --log-opt max-size=10m
      --log-opt max-file=3
      --network {{ llamaswap_backend_network }}
      --gpus device={{ llamaswap_crispasr_tts_gpu_uuid }}
      -v {{ llamaswap_crispasr_tts_cache_path }}:{{ llamaswap_crispasr_tts_cache_container_path }}
      --entrypoint crispasr
      {{ llamaswap_crispasr_image }}
      --server
      --host 0.0.0.0
      --port {{ llamaswap_crispasr_tts_internal_port }}
      --cache-dir {{ llamaswap_crispasr_tts_cache_container_path }}
      --backend {{ llamaswap_crispasr_tts_design_backend }}
      -m auto
      --language de
    cmd_stop: >-
      docker stop --time 15 {{ llamaswap_crispasr_tts_design_container_name }}
    proxy: "http://{{ llamaswap_crispasr_tts_design_container_name }}:{{ llamaswap_crispasr_tts_internal_port }}"
    check_endpoint: "/health"
    supports_function_calling: false
    supports_vision: false
    supports_reasoning: false
    mode: audio_speech
    group: "tts"

llamaswap_model_groups:
  forever:
    persistent: true
    swap: false
    exclusive: false
  asr:
    persistent: true
    swap: false
    exclusive: false
  tts:
    swap: true
    exclusive: true
  "3090":
    swap: true
    exclusive: false

llamaswap_preload:
  - "{{ model_group_alias['home-embed'] }}"
  - "{{ model_group_alias['home-asr'] }}"
  - "qwen3-tts"
  - "{{ model_group_alias['home-hermes'] }}"
