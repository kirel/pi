---
hermes_litellm_model_profiles:
  local_hermes:
    - home-hermes
    - Qwen3.8-27B-Instruct
    - Qwen3.8-27B-Instruct-low
    - Qwen3.8-27B-Instruct-medium
    - Qwen3.8-27B-Instruct-nothink
    - minimax-m3
    - glm-5.2
    - home-asr
    - home-tts
    - home-tts-design
  voice_only:
    - home-asr
    - home-tts
    - home-tts-design
  all_models:
    - all-proxy-models
  docker_chat:
    - glm-5.3
    - minimax-m3
    - gpt-5.6-sol-cpa
    - gpt-5.6-terra-cpa
    - gpt-5.6-luna-cpa
    - gpt-5.5-cpa
    - grok-4.5-cpa
    - claude-opus-4-6-thinking-cpa
    - gpt-image-2
    - gpt-image-2-cpa
    - gemini-3.1-flash-image-cpa
    - grok-imagine-image-cpa
    - grok-imagine-image-quality-cpa
    - home-asr
    - home-tts
    - home-tts-design

hermes_mcp_tool_profiles:
  shopping:
    todoist:
      - find-sections
      - find-tasks
      - fetch
      - add-tasks
      - update-tasks
      - complete-tasks
      - delete-object

litellm_managed_virtual_keys:
  baremetal_daniel:
    key: "{{ vault_hermes_baremetal_litellm_api_key | trim }}"
    key_alias: hermes
    team_id: hermes-baremetal
    models: "{{ hermes_litellm_model_profiles.all_models }}"
    mcp_access_groups:
      - web
      - maps
      - home_admin
      - shopping
      - photos
      - notes
      - workflow_admin
      - code
      - media_generation
    mcp_tool_permissions:
      todoist: "{{ hermes_mcp_tool_profiles.shopping.todoist }}"

litellm_managed_virtual_key_teams:
  baremetal:
    team_id: hermes-baremetal
    team_alias: Hermes Bare Metal
    models: "{{ hermes_litellm_model_profiles.all_models }}"
    object_permission:
      mcp_servers:
        - todoist
      mcp_access_groups:
        - web
        - maps
        - home_admin
        - shopping
        - photos
        - notes
        - workflow_admin
        - code
        - media_generation
